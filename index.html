<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop Self-Serve Onboarding v3b</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',-apple-system,sans-serif; background:#f7f8fa; color:#1a1a2e; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .container { text-align:center; max-width:480px; padding:40px 24px; }
  .logo { font-size:28px; font-weight:800; color:#6c5ce7; letter-spacing:-1px; margin-bottom:8px; }
  .sub { font-size:14px; color:#5a5d7a; margin-bottom:36px; }
  .cards { display:flex; gap:16px; }
  .card { flex:1; background:white; border:2px solid #e8eaef; border-radius:16px; padding:28px 20px; cursor:pointer; transition:all 0.15s; text-decoration:none; color:inherit; }
  .card:hover { border-color:#6c5ce7; box-shadow:0 4px 20px rgba(108,92,231,0.12); transform:translateY(-2px); }
  .card-icon { font-size:32px; margin-bottom:12px; }
  .card h2 { font-size:16px; font-weight:700; margin-bottom:6px; }
  .card p { font-size:12px; color:#5a5d7a; line-height:1.5; }
  .tag { display:inline-block; margin-top:10px; font-size:10px; padding:3px 10px; border-radius:8px; font-weight:600; }
  .tag-form { background:#f0eeff; color:#5b4cdb; }
  .tag-agent { background:#e6faf7; color:#00917c; }
  .version { margin-top:28px; font-size:11px; color:#9496ad; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">Loop</div>
  <div class="sub">Self-Serve Onboarding Portal v3b</div>
  <div class="cards">
    <a href="v3b-form.html" class="card">
      <div class="card-icon">&#9776;</div>
      <h2>Form View</h2>
      <p>Step-by-step guided form with tabs for Access, Connect, Business, and Billing.</p>
      <div class="tag tag-form">Traditional</div>
    </a>
    <a href="v3b-agent.html" class="card">
      <div class="card-icon">&#9883;</div>
      <h2>Agent View</h2>
      <p>AI-guided conversational onboarding with smart recommendations.</p>
      <div class="tag tag-agent">AI-Powered</div>
    </a>
  </div>
  <div class="version">v3b &middot; May 2026 &middot; Loop AI</div>
</div>
</body>
</html>
